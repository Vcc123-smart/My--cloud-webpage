<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Web Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body {
            min-height: 100vh;
            padding: 40px 20px;
            background-color: #f0f4f8;
            color: #1a1a2e;
            text-align: center;
        }

        /* Dark mode styles */
        body.dark-mode {
            background-color: #12121a;
            color: #f0f4f8;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 40px;
            color: #2b3566;
        }
        body.dark-mode h1 {
            color: #7dd3fc;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            min-width: 240px;
        }
        body.dark-mode .card {
            background-color: #1e1e2f;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }

        .card h3 {
            margin-bottom: 18px;
            font-size: 1.3rem;
        }

        .counter-value {
            font-size: 2rem;
            font-weight: bold;
            margin:12px 0;
        }

        input[type="text"] {
            width: 100%;
            padding:10px 12px;
            font-size:1rem;
            border:2px solid #cbd5e1;
            border-radius:8px;
            margin-bottom:12px;
        }
        body.dark-mode input[type="text"] {
            background:#2d2d44;
            color:white;
            border-color:#475569;
        }

        button {
            padding: 11px 22px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #3b82f6;
            color: white;
            font-weight:500;
            box-shadow: 0 3px 10px rgba(59,130,246,0.35);
            transition: transform 0.2s ease, background-color 0.3s ease;
        }

        button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap:18px;
        }

        .typed-output {
            font-size:1.05rem;
            margin-top:8px;
        }
    </style>
</head>
<body>

    <h1>My Interactive Web Page</h1>

    <div class="container">
        <!-- Click Counter Card -->
        <div class="card">
            <h3>Click Counter</h3>
            <div class="counter-value" id="countDisplay">0</div>
            <button id="clickBtn">Click Me</button>
        </div>

        <!-- Live Text Display Card -->
        <div class="card">
            <h3>Live Text Display</h3>
            <input type="text" id="textInput" placeholder="Type something...">
            <div class="typed-output">You typed: <span id="textOutput"></span></div>
        </div>
    </div>

    <div class="button-row">
        <button id="darkModeBtn">Toggle Dark Mode</button>
        <button id="welcomeBtn">Show Welcome Message</button>
    </div>


    <script>
        // Click Counter
        let count = 0;
        const countDisplay = document.getElementById("countDisplay");
        const clickBtn = document.getElementById("clickBtn");
        clickBtn.addEventListener("click", ()=>{
            count++;
            countDisplay.textContent = count;
        });

        // Live text input
        const textInput = document.getElementById("textInput");
        const textOutput = document.getElementById("textOutput");
        textInput.addEventListener("input", ()=>{
            textOutput.textContent = textInput.value;
        });

        // Dark Mode Toggle
        const darkModeBtn = document.getElementById("darkModeBtn");
        darkModeBtn.addEventListener("click", ()=>{
            document.body.classList.toggle("dark-mode");
        });

        // Welcome Pop‑up
        const welcomeBtn = document.getElementById("welcomeBtn");
        welcomeBtn.addEventListener("click", ()=>{
            alert("Welcome to my interactive website!");
        });
    </script>

</body>
</html>
